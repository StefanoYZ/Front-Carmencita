name: Test and Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm run test

  deploy:
    name: Deploy al Droplet
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar .env y reconstruir solo "frontend"
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: ENV_FILE
          script: |
            set -euo pipefail
            echo "$ENV_FILE" > /opt/carmencita/deploy/.env

            # Clon dedicado a CI: siempre se alinea con origin/main, sin merges.
            cd /opt/carmencita/Front-Carmencita
            git fetch origin main
            git reset --hard origin/main

            cd /opt/carmencita/deploy
            docker compose up --build -d --remove-orphans frontend
            docker image prune -f
