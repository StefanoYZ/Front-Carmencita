server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS embebido de Docker (127.0.0.11): al usar una variable en proxy_pass en
    # vez de un hostname literal, nginx reconsulta este resolver segun "valid"
    # en lugar de cachear la IP del contenedor "backend" para siempre. Sin esto,
    # si backend se reconstruye/recrea mientras este contenedor sigue corriendo,
    # nginx sigue apuntando a la IP vieja (que Docker puede reasignar a OTRO
    # contenedor, enrutando trafico al servicio equivocado).
    resolver 127.0.0.11 valid=10s;

    # Reverse proxy interno al backend (red de Docker Compose, hostname "backend").
    # El navegador nunca sale del mismo origen (mismo dominio/puerto), asi que no
    # hay peticiones cross-origin en produccion y el CORS del backend deja de ser
    # una dependencia critica (solo queda como resguardo para accesos directos).
    location /api/v1/ {
        set $backend_upstream http://backend:8000;
        # Sin path despues de la variable: nginx reenvia la URI original tal
        # cual (/api/v1/destinos, /api/v1/auth/login, etc). Si se agrega un
        # path literal aqui (p. ej. "$backend_upstream/api/v1/"), nginx deja
        # de anexar el resto de la URI y siempre reenvia solo "/api/v1/".
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
